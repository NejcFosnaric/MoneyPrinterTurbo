# Release compose file (pre-built image from GHCR).
#
# Host ports and bind-mount sources are parameterised so they can be overridden
# in Coolify (or any environment) when the defaults clash with something else on
# the host. Set these as environment variables / build variables in Coolify:
#
#   WEBUI_PORT        host port for the Streamlit WebUI   (default 8501)
#   API_PORT          host port for the FastAPI service   (default 8080)
#   WEBUI_BIND_HOST   host interface for the WebUI        (default 127.0.0.1)
#   API_BIND_HOST     host interface for the API          (default 127.0.0.1)
#   CONFIG_FILE       host path to config.toml            (default ./config.toml)
#   STORAGE_DIR       host path for media output          (default ./storage)
#
# The container-side ports stay fixed: the API reads its port from
# config.toml (`listen_port`, default 8080) and the WebUI is started with
# `--server.port=8501` below, so only the host side is remapped.
# Use 0.0.0.0 for *_BIND_HOST to expose a service beyond localhost.
#
# CONFIG_FILE must already exist on the host as a *file*. Docker creates a
# missing bind-mount source as a *directory*, so the app then finds a directory
# at /MoneyPrinterTurbo/config.toml, tries to remove it in load_config(), and
# crash-loops with "OSError: [Errno 16] Device or resource busy" - a mount point
# cannot be deleted from inside the container. config.toml is gitignored, so a
# fresh clone (Coolify, CI) never has one. Seed it before the first deploy:
#
#   cp config.example.toml config.toml
#
# On PaaS deployments that re-clone the repo per deploy, point CONFIG_FILE at a
# path outside the clone so API keys saved from the WebUI survive redeploys.
# Both services must share the same file: the WebUI writes settings the API reads.

x-common-volumes: &common-volumes
  - ${CONFIG_FILE:-./config.toml}:/MoneyPrinterTurbo/config.toml
  - ${STORAGE_DIR:-./storage}:/MoneyPrinterTurbo/storage

services:
  webui:
    image: ghcr.io/harry0703/moneyprinterturbo:latest
    container_name: "moneyprinterturbo-webui"
    ports:
      - "${WEBUI_BIND_HOST:-127.0.0.1}:${WEBUI_PORT:-8501}:8501"
    command: [ "streamlit", "run", "./webui/Main.py", "--server.address=0.0.0.0", "--server.port=8501", "--browser.serverAddress=127.0.0.1", "--server.enableCORS=True", "--browser.gatherUsageStats=False", "--client.toolbarMode=minimal", "--logger.hideWelcomeMessage=True", "--server.showEmailPrompt=False" ]
    volumes: *common-volumes
    restart: always
  api:
    image: ghcr.io/harry0703/moneyprinterturbo:latest
    container_name: "moneyprinterturbo-api"
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8080}:8080"
    command: [ "python3", "main.py" ]
    volumes: *common-volumes
    restart: always
